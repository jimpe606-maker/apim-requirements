set: PROC
area: ARCH
requirements:
  - id: PROC-ARCH-001
    title: Demonstrated plane separation and control-plane outage tolerance
    layer: technology
    type: assurance
    level: system
    priority: must
    statement: The offer shall demonstrate, in the buyer's proof-of-concept environment, that the gateway keeps serving deployed routes for 60 minutes with the control plane stopped and that the gateway accepts tokens from an external authorization server configured only through RFC 8414 metadata.
    rationale: Plane separation is a hard architectural constraint that product datasheets routinely overstate, so it is verified by a live demonstration rather than by a declaration.
    source: SOL-ARCH-001
    acceptance_criteria:
      - With the control plane stopped for 60 minutes, a synthetic client receives no errors other than those expected from the deployed policies on existing routes.
      - Gateway, control plane and observability components are scaled independently during the demonstration without redeploying another component.
      - The gateway validates tokens from a buyer-supplied external authorization server after configuration of its issuer metadata URL only, with no custom code.
    verification: demonstration
    allocated_to: [C1, C2, C5, C14]
    traces:
      satisfies: [SOL-ARCH-001]
      use_cases: [UC-05]
      standards: [NIST SP 800-207, RFC 8414]
    procurement:
      kind: mandatory
      evidence_required:
        - Recorded proof-of-concept session with synthetic-client error log
        - Architecture document showing deployable units per plane and their scaling mechanisms
        - Configuration artefact used to integrate the external authorization server
    status: draft
    owner: procurement
  - id: PROC-ARCH-002
    title: Supported runtimes for data plane and control plane
    layer: technology
    type: assurance
    level: system
    priority: should
    statement: The offer shall be scored on the range of supported, vendor-maintained runtimes for the data plane and hosting options for the control plane, verified by deploying a gateway in a buyer-controlled Kubernetes cluster that registers with the control plane over an outbound, mutually authenticated connection.
    rationale: Hosting options determine whether data residency and latency needs can be met per API without changing product.
    source: SOL-ARCH-002
    acceptance_criteria:
      - The vendor lists supported runtimes for the gateway and the control plane separately, with support status for each.
      - A gateway deployed by the buyer in its own Kubernetes cluster registers with the control plane using only outbound connections with mutual TLS.
    verification: demonstration
    allocated_to: [C1, C2]
    traces:
      satisfies: [SOL-ARCH-002]
      use_cases: [UC-05]
    procurement:
      kind: evaluated
      evidence_required:
        - Support matrix of runtimes for gateway and control plane
        - Recorded deployment and registration of a gateway in the buyer's cluster
      scoring:
        max_points: 5
        weight: 1.0
        scale:
          - points: 5
            condition: Gateway supported on public cloud, private cloud and on-premises Kubernetes and virtual machines; control plane offered both self-hosted and vendor-hosted.
          - points: 3
            condition: Gateway supported on Kubernetes in any environment; control plane offered in one hosting model only.
          - points: 1
            condition: Gateway supported only in vendor-hosted or single-cloud environments.
          - points: 0
            condition: The buyer-cluster registration demonstration fails.
    status: draft
    owner: procurement
