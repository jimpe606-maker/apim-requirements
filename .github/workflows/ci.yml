name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test-export:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - name: Lint requirements
        run: python tools/lint.py
      - name: Fail on non-atomic statements (W05)
        run: "! python tools/lint.py --strict | grep W05"
      - name: Test tooling
        run: pytest -q
      - name: Export catalogue, CSV, traceability and scoring
        run: python tools/export.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.python-version == '3.13'
        with:
          name: requirements-export
          path: build/
