name: Tooling bug
description: Something is wrong with tools/lint.py, tools/export.py or CI
labels: ["tooling"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Command, output and what you expected instead.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Python version and OS
